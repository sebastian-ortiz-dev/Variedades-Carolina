        required: true
        schema:
          $ref: '#/definitions/variedades_carolina_src_inventory_DTOs.CreateMeasurentUnit'
      produces:
      - application/json
      responses:
        "201":
          description: created
          schema:
            $ref: '#/definitions/variedades_carolina_src_inventory_DTOs.ListMeasurentUnit'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      security:
      - BearerAuth: []
      summary: Measurement units
      tags:
      - Inventory
  /inventory/measurement-units/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a measurent unit.
      parameters:
      - description: Id de la medida
        in: path
        name: id
        required: true
        type: string
      responses:
