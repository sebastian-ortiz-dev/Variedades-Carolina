basePath: /api/v1
definitions:
  variedades_carolina_src_auth_DTOs.LoginResponseUser:
    properties:
      expirein:
        type: string
      token:
        type: string
      tokentype:
        type: string
      user:
        $ref: '#/definitions/variedades_carolina_src_auth_DTOs.Userdata'
    type: object
  variedades_carolina_src_auth_DTOs.LoginUserEntrydata:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  variedades_carolina_src_auth_DTOs.Userdata:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      rol:
        type: string
    type: object
  variedades_carolina_src_errors.HttpError:
    properties:
      codigo:
        type: string
      detail:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Servicio backend de autenticación y gestión.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API de Variedades Carolina
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login of the application and get the token JWT.
      parameters:
      - description: Datos del usuario
        in: body
        name: userdata
        required: true
        schema:
          $ref: '#/definitions/variedades_carolina_src_auth_DTOs.LoginUserEntrydata'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/variedades_carolina_src_auth_DTOs.LoginResponseUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      summary: Login users get the JWT token
      tags:
      - auth
  /inventory/categories:
    get:
      description: List categories.
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Categories
      tags:
      - Test
  /inventory/modify:
    get:
      description: Probar handlers con grupos.
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Test handler
      tags:
      - Test
securityDefinitions:
  BearerAuth:
    description: 'Escribe ''Bearer '' seguido de tu token JWT Ejemplo: "Bearer tokenJWT"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
