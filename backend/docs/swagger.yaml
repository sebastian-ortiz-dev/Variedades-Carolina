          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      security:
      - BearerAuth: []
      summary: Measurement units
      tags:
      - Inventory
    post:
      consumes:
      - application/json
      description: List Measurement units.
      parameters:
      - description: Datos de la medida
        in: body
