basePath: /api/v1
definitions:
  variedades_carolina_src_auth_DTOs.LoginResponseUser:
    properties:
      expirein:
        type: string
      token:
        type: string
      tokentype:
        type: string
      user:
        $ref: '#/definitions/variedades_carolina_src_auth_DTOs.Userdata'
    type: object
  variedades_carolina_src_auth_DTOs.LoginUserEntrydata:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  variedades_carolina_src_auth_DTOs.Userdata:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      rol:
        type: string
    type: object
  variedades_carolina_src_errors.HttpError:
    properties:
      codigo:
        type: string
      detail:
        type: string
    type: object
  variedades_carolina_src_inventory_DTOs.CreateCategories:
    properties:
      nombre:
        type: string
    required:
    - nombre
    type: object
  variedades_carolina_src_inventory_DTOs.CreateMeasurentUnit:
    properties:
      nombre:
        type: string
    required:
    - nombre
    type: object
  variedades_carolina_src_inventory_DTOs.ListCategories:
    properties:
      id:
        type: string
      nombre:
        type: string
    type: object
  variedades_carolina_src_inventory_DTOs.ListMeasurentUnit:
    properties:
      id:
        type: string
      nombre:
        type: string
    type: object
  variedades_carolina_src_inventory_DTOs.UpdateCategories:
    properties:
      nombre:
        type: string
    required:
    - nombre
    type: object
  variedades_carolina_src_inventory_DTOs.UpdateMeasurentUnit:
    properties:
      nombre:
        type: string
    required:
    - nombre
    type: object
  variedades_carolina_src_inventory_DTOs.UpdateMinimum:
    properties:
      minimim_cash:
        type: number
    required:
    - minimim_cash
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Servicio backend de autenticación y gestión.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API de Variedades Carolina
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login of the application and get the token JWT.
      parameters:
      - description: Datos del usuario
        in: body
        name: userdata
        required: true
        schema:
          $ref: '#/definitions/variedades_carolina_src_auth_DTOs.LoginUserEntrydata'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/variedades_carolina_src_auth_DTOs.LoginResponseUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      summary: Login users get the JWT token
      tags:
      - auth
  /inventory/categories:
    get:
      description: List categories.
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            items:
              $ref: '#/definitions/variedades_carolina_src_inventory_DTOs.ListCategories'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      security:
      - BearerAuth: []
      summary: Categories
      tags:
      - Inventory
    post:
      consumes:
      - application/json
      description: Create a new categorie.
      parameters:
      - description: Datos de la categoria
        in: body
        name: dataCategorie
        required: true
        schema:
          $ref: '#/definitions/variedades_carolina_src_inventory_DTOs.CreateCategories'
      produces:
      - application/json
      responses:
        "201":
          description: created
          schema:
            $ref: '#/definitions/variedades_carolina_src_inventory_DTOs.ListCategories'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      security:
      - BearerAuth: []
      tags:
      - Inventory
  /inventory/categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a categorie.
      parameters:
      - description: Id de la categoria
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: no content
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      security:
      - BearerAuth: []
      tags:
      - Inventory
    patch:
      consumes:
      - application/json
      description: Update a categorie.
      parameters:
      - description: Id de la categoria
        in: path
        name: id
        required: true
        type: string
      - description: Datos de la categoria
        in: body
        name: dataCategorie
        required: true
        schema:
          $ref: '#/definitions/variedades_carolina_src_inventory_DTOs.UpdateCategories'
      responses:
        "204":
          description: no content
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/variedades_carolina_src_errors.HttpError'
      security:
      - BearerAuth: []
      tags:
      - Inventory
  /inventory/measurement-units:
